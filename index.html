<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <meta name="description" content="An interactive map of how AI is used across Earth and planetary science." />
    <title>What Does “AI” Mean in Earth Science?</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;background:#080b10;color:#8a98aa;font-family:system-ui,sans-serif">
        <strong style="color:#e8eef6;font-size:20px">Loading the Earth / AI constellation…</strong>
        <span style="margin-top:10px;font-size:13px">Preparing the interactive paper landscape.</span>
      </div>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;background:#080b10;color:#9ba9ba;font-family:system-ui,sans-serif">' +
          '<strong style="color:#e8eef6;font-size:24px">This interactive site needs a local web server.</strong>' +
          '<p style="max-width:560px;line-height:1.6">Opening <code>index.html</code> directly cannot load Vite modules or the paper data. In the project folder, run <code style="color:#6ce5b1">npm run dev</code>, then open the Local URL shown in the terminal.</p>' +
          '</div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
